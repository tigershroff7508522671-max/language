<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Languages.com | Learning Dashboard</title>

<style>
:root {
    --primary: #f0df22;
    --primary-dark: #0a150e;
    --bg: #f0fdf4;
    --card: #ffffff;
    --text: #064e3b;
    --muted: #6b7280;
    --locked: #e5e7eb;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* ---------- TOP BAR ---------- */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}

.topbar {
    max-width: 1400px;
    margin: auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: white;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 600;
}

.brand-logo {
    width: 38px;
    height: 38px;
    background: white;
    color: var(--primary);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
}

.page-title {
    font-size: 18px;
    font-weight: 500;
    opacity: 0.95;
}

.datetime {
    background: rgba(255,255,255,0.18);
    padding: 8px 14px;
    border-radius: 12px;
    text-align: right;
    font-size: 13px;
    backdrop-filter: blur(6px);
}

.datetime .time {
    font-size: 15px;
    font-weight: 600;
}

@media (max-width: 768px) {
    .page-title { display: none; }
}

/* ---------- PROGRESS ---------- */
.progress-container {
    width: 90%;
    max-width: 900px;
    background: #fff9c4;
    border-radius: 999px;
    margin: 25px auto 10px;
    height: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: var(--primary);
    color: black;
    font-size: 12px;
    font-weight: 600;
    line-height: 20px;
    text-align: center;
    transition: width 0.4s ease;
}

.progress-text {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 15px;
}

/* ---------- MAIN ---------- */
main {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

/* ---------- LESSON GRID ---------- */
.lesson-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 18px;
}

.lesson-logo {
    background: var(--card);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    border-top: 4px solid var(--primary);
    transition: transform 0.2s, box-shadow 0.2s;
}

.lesson-logo span {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
}

.lesson-logo:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

/* ---------- LESSON VIEW ---------- */
.lesson-container {
    display: none;
    background: var(--card);
    padding: 25px;
    margin-top: 20px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.phrase {
    margin-bottom: 12px;
    padding: 12px;
    background: #fffde7;
    border-radius: 12px;
  


    display: flex;
    justify-content: space-between;
    align-items: center;
}



.phrase .english {
    font-weight: bold;
    font-size: 16px;
}

.phrase .russian {
    color: #f0df22;
    font-size: 15px;
    margin-top: 2px;
}

.phrase .pronunciation {
    color: #6b7280;
    font-style: italic;
    margin-top: 2px;
}

.speak-btn {
    background: var(--primary);
    border: none;
    color: black;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    margin-left: 10px;
    transition: background 0.3s;
}
.speak-btn:hover { background: var(--primary-dark); color:white; }

.back-btn {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 30px;
    background: var(--primary);
    color: black;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 500;
}

.back-btn:hover {
    background: var(--primary-dark);
    color:white;
}
</style>
</head>

/* ---------- LIVE DATE & TIME ---------- */
function updateDateTime() {
    const now = new Date();
    const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    document.getElementById("dayDate").textContent =
        days[now.getDay()] + ", " + now.toLocaleDateString();
    document.getElementById("timeNow").textContent =
        now.toLocaleTimeString();
}
setInterval(updateDateTime, 1000);
updateDateTime();

/* ---------- LESSON SYSTEM ---------- */
const TOTAL = 100;
const lessonsGrid = document.getElementById("lessonsGrid");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");

// UNLOCK ALL LESSONS
const unlocked = TOTAL;
let completed = JSON.parse(localStorage.getItem("completedLessons")) || [];

function updateProgress() {
    const percent = Math.round((completed.length / TOTAL) * 100);
    progressBar.style.width = percent + "%";
    progressBar.textContent = percent + "%";
    progressText.textContent = `${completed.length} of ${TOTAL} lessons completed`;
}
updateProgress();


/* ---------- CREATE LESSONS ---------- */
for (let i = 1; i <= TOTAL; i++) {
    const card = document.createElement("div");
    card.className = "lesson-logo";
    card.innerHTML = `Lesson ${i}<span>Available</span>`;
    card.onclick = () => openLesson(i);
    lessonsGrid.appendChild(card);
}

/* ---------- OPEN LESSON ---------- */
function openLesson(num) {
    lessonsGrid.style.display = "none";
    const lessonContent = document.getElementById("lessonContent");
    lessonContent.style.display = "block";
    document.getElementById("lessonTitle").textContent = `Lesson ${num}`;

    const phrasesDiv = document.getElementById("lessonPhrases");
    phrasesDiv.innerHTML = "";

    const phrases = lessonsData[num] || [{ english: "Content coming soon!", hindi: "", pron: "" }];
    phrases.forEach(p => {
        const phraseDiv = document.createElement("div");
        phraseDiv.className = "phrase";
        phraseDiv.innerHTML = `
            <div class="english">${p.english}</div>
            <div class="hindi">${p.hindi}</div>
            <div class="pronunciation">${p.pron || ""}</div>
           
            <button class="speak-btn">🔊</button>
        `;
        phrasesDiv.appendChild(phraseDiv);

        // speak button
        const btn = phraseDiv.querySelector('.speak-btn');
        btn.addEventListener('click', () => {
            const utter = new SpeechSynthesisUtterance(p.pron);
            utter.lang = 'en-US';
            speechSynthesis.speak(utter);
        });
    });

    // mark completed
    if (!completed.includes(num)) {
        completed.push(num);
        localStorage.setItem("completedLessons", JSON.stringify(completed));
        updateProgress();
    }
}

/* ---------- BACK BUTTON ---------- */
document.getElementById("backBtn").onclick = () => {
    document.getElementById("lessonContent").style.display = "none";
    lessonsGrid.style.display = "grid";
};
</script>
