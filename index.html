<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Languages.com | Learn Languages Worldwide</title>

<style>
:root {
    --primary: #2563eb;
    --primary-dark: #1e40af;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
}

* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background-color: var(--bg);
    margin: 0;
    color: var(--text);
}

/* ---------- HEADER ---------- */
header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 22px;
    text-align: center;
    font-size: 24px;
    font-weight: 600;
}

/* ---------- MAIN ---------- */
main {
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
}

h2 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 25px;
}

/* ---------- CARD ---------- */
.language-container {
    background: var(--card);
    padding: 24px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    max-height: 420px;
    overflow-y: auto;
}

.language-title {
    font-weight: 600;
    margin-bottom: 15px;
}

/* ---------- LANGUAGE ITEMS ---------- */
.language-container label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s ease;
}

.language-container label:hover {
    background: #f1f5f9;
}

.language-container input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--primary);
    cursor: pointer;
}

/* ---------- BUTTON ---------- */
button {
    display: block;
    margin: 30px auto 0;
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 500;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
}

button:hover {
    background: var(--primary-dark);
}

button:active {
    transform: scale(0.97);
}
</style>
</head>

<body>

<header>Languages.com</header>

<main>
    <h2>Choose Your Language</h2>
    <p class="subtitle">Select one language to start learning</p>

    <div class="language-container">
        <div class="language-title">Available Languages</div>

        <label><input type="checkbox" class="lang" value="English"> English</label>
        <label><input type="checkbox" class="lang" value="Mandarin Chinese"> Mandarin Chinese</label>
        <label><input type="checkbox" class="lang" value="Hindi"> Hindi</label>
        <label><input type="checkbox" class="lang" value="Spanish"> Spanish</label>
        <label><input type="checkbox" class="lang" value="French"> French</label>
        <label><input type="checkbox" class="lang" value="Arabic"> Arabic</label>
        <label><input type="checkbox" class="lang" value="Bengali"> Bengali</label>
        <label><input type="checkbox" class="lang" value="Russian"> Russian</label>
        <label><input type="checkbox" class="lang" value="Portuguese"> Portuguese</label>
        <label><input type="checkbox" class="lang" value="Urdu"> Urdu</label>
        <label><input type="checkbox" class="lang" value="German"> German</label>
        <label><input type="checkbox" class="lang" value="Japanese"> Japanese</label>
        <label><input type="checkbox" class="lang" value="Korean"> Korean</label>
        <label><input type="checkbox" class="lang" value="Italian"> Italian</label>
    </div>

    <button onclick="goToLessons()">Continue</button>
</main>

<script>
/* ---------- ROLE ---------- */
let role = "user"; // change to "owner" to show all

const languages = document.querySelectorAll(".lang");

/* ---------- ROLE FILTER ---------- */
languages.forEach(lang => {
    if (role === "owner") return;

    if (
        lang.value === "English" ||
        lang.value === "Russian" ||
        lang.value.includes("Mandarin")
    ) {
        lang.parentElement.style.display = "flex";
    } else {
        lang.parentElement.style.display = "none";
    }
});

/* ---------- SINGLE SELECTION ---------- */
languages.forEach(lang => {
    lang.addEventListener("change", () => {
        if (lang.checked) {
            languages.forEach(other => {
                if (other !== lang) other.checked = false;
            });
        }
    });
});

/* ---------- CONTINUE ---------- */
function goToLessons() {
    let selectedLang = null;

    languages.forEach(lang => {
        if (lang.checked && lang.parentElement.style.display !== "none") {
            selectedLang = lang.value;
        }
    });

    if (!selectedLang) {
        alert("Please select one language to continue.");
        return;
    }

    localStorage.setItem("selectedLanguage", selectedLang);
    window.location.href = selectedLang + ".html";
}
</script>

</body>
</html>
