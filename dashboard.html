<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard | Languages.com</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
if (localStorage.getItem("loggedIn") !== "true") {
  window.location.href = "login.html";
}
</script>

<style>
:root {
  --primary: #2563eb;
  --primary-dark: #1e40af;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --success: #16a34a;
  --danger: #ef4444;
}

* { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family: "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.dashboard-container {
  max-width: 500px;
  width: 100%;
  text-align: center;
}

/* ---------- PROFILE CARD ---------- */
.profile-card {
  background: var(--card);
  padding: 30px 25px;
  border-radius: 18px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.12);
  transition: transform 0.2s;
  position: relative;
}

.profile-card:hover {
  transform: translateY(-3px);
}

.profile-card img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 15px;
  border: 3px solid var(--primary);
}

/* ---------- TEXT ---------- */
.profile-card h2 {
  font-size: 22px;
  margin-bottom: 4px;
  color: var(--text);
}

.profile-card p {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 6px;
  text-align: left;
}

/* ---------- BUTTONS ---------- */
.button-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 20px;
}

.button-group button {
  padding: 12px 0;
  font-size: 15px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

.start-btn { background: var(--primary); color: white; }
.start-btn:hover { background: var(--primary-dark); }

.logout-btn { background: var(--danger); color: white; }
.logout-btn:hover { background: #b91c1c; }

/* ---------- EDIT MODAL ---------- */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
}

.modal-content {
  background: white;
  border-radius: 15px;
  padding: 30px 25px;
  max-width: 400px;
  width: 90%;
  text-align: left;
  position: relative;
}

.modal-content h3 {
  margin-bottom: 15px;
  text-align: center;
}

.modal-content input {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid #cbd5f5;
  font-size: 14px;
}

.modal-content input:focus { border-color: var(--primary); outline:none; }

.modal-content button {
  padding: 10px 0;
  width: 100%;
  font-weight: 600;
  border-radius: 10px;
  border:none;
  cursor:pointer;
  margin-top: 10px;
  transition:0.2s;
}

.save-btn { background: var(--primary); color:white; }
.save-btn:hover { background: var(--primary-dark); }

.close-btn { background: var(--danger); color:white; }
.close-btn:hover { background: #b91c1c; }

.progress-container {
  background: #e5e7eb;
  border-radius: 12px;
  height: 16px;
  margin: 10px 0;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: var(--primary);
  width: 0%;
  border-radius: 12px;
  transition: width 0.6s ease-in-out;
}

.certificate {
  margin-top: 8px;
  font-weight: 600;
  color: var(--success);
  font-size: 14px;
  text-align: left;
}

.edit-btn {
  position: absolute;
  top:15px;
  right:15px;
  background: var(--primary);
  color:white;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  cursor:pointer;
  transition:0.2s;
}
.edit-btn:hover { background: var(--primary-dark); }

@media(max-width:480px){
  .dashboard-container { padding: 0 10px; }
}
</style>
</head>

<body>

<div class="dashboard-container">
  <div class="profile-card" id="profileCard">
    <!-- Profile info injected here -->
    <button class="edit-btn" onclick="openEditModal()">Edit</button>
  </div>

  <div class="button-group">
    <button class="start-btn" onclick="startLearning()">Start Learning</button>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Edit Profile</h3>
    <input type="file" id="profileUpload" accept="image/*">
    <input type="text" id="firstName" placeholder="First Name">
    <input type="text" id="lastName" placeholder="Last Name">
    <input type="tel" id="phone" placeholder="Phone Number">
    <input type="text" id="nationality" placeholder="Nationality">
    <input type="text" id="passport" placeholder="Passport Number">
    <button class="save-btn" onclick="saveProfile()">Save Changes</button>
    <button class="close-btn" onclick="closeEditModal()">Cancel</button>
  </div>
</div>

<script>
let user = JSON.parse(localStorage.getItem("user")) || {};

// Default picture
if(!user.picture) user.picture = "https://via.placeholder.com/100";

const profileCard = document.getElementById("profileCard");
const modal = document.getElementById("editModal");
const profileUpload = document.getElementById("profileUpload");

function renderDashboard() {
  profileCard.innerHTML = `
    <img src="${user.picture}" alt="Profile Picture">
    <h2>${user.firstName || user.name || "Guest User"} ${user.lastName || ""}</h2>
    <p><b>Email:</b> ${user.email || "Not set"}</p>
    <p><b>Phone:</b> ${user.phone || "-"}</p>
    <p><b>Nationality:</b> ${user.nationality || "-"}</p>
    <p><b>Passport:</b> ${user.passport || "-"}</p>

    <div class="progress-container">
      <div class="progress-bar" style="width: ${user.progress || 0}%"></div>
    </div>

    ${user.certificate ? '<div class="certificate">🎉 Certificate Unlocked!</div>' : ''}

    <button class="edit-btn" onclick="openEditModal()">Edit</button>
  `;
}

// Open modal and populate fields
function openEditModal() {
  modal.style.display = "flex";
  document.getElementById("firstName").value = user.firstName || user.name || "";
  document.getElementById("lastName").value = user.lastName || "";
  document.getElementById("phone").value = user.phone || "";
  document.getElementById("nationality").value = user.nationality || "";
  document.getElementById("passport").value = user.passport || "";
}

// Close modal
function closeEditModal() {
  modal.style.display = "none";
}

// Preview profile picture
profileUpload.addEventListener("change", function(event){
  const reader = new FileReader();
  reader.onload = function() {
    user.picture = reader.result;
    renderDashboard();
  }
  reader.readAsDataURL(event.target.files[0]);
});

// Save changes
function saveProfile() {
  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const nationality = document.getElementById("nationality").value.trim();
  const passport = document.getElementById("passport").value.trim();

  if(!firstName) {
    alert("First name is required!");
    return;
  }

  user.firstName = firstName;
  user.lastName = lastName;
  user.phone = phone;
  user.nationality = nationality;
  user.passport = passport;

  localStorage.setItem("user", JSON.stringify(user));
  alert("Profile updated successfully!");
  closeEditModal();
  renderDashboard();
}

// Buttons
function startLearning() {
  window.location.href = "index.html";
}

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

// Initial render
renderDashboard();
</script>

</body>
</html>
